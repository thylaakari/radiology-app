<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }

      .logo {
        opacity: 0;
        animation: fadeIn 1s ease forwards;
        margin-bottom: 20px;
      }

      .loader {
        border: 3px solid #27272a;
        border-top: 3px solid #00c16a;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h2 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px 0;
      }

      p {
        color: #71717a;
        font-size: 0.875rem;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <img class="logo" src="whitelogo.svg" alt="logo" />
    <div class="loader"></div>
  </body>
</html>
