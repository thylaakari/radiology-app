name: Release Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSBuild
        if: matrix.name == 'windows'
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio shell
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm install

      - name: Build Windows portable
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          npm run tauri build
          Compress-Archive -Path "src-tauri/target/release/radiology-hub.exe" -DestinationPath "radiology-hub-windows-portable.zip"

      - name: Build macOS portable
        if: matrix.name == 'macos'
        run: |
          npm run tauri build -- --bundles app
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/radiology-hub.app" "radiology-hub-macos-portable.zip"

      - name: Build Linux portable
        if: matrix.name == 'linux'
        run: |
          npm run tauri build -- --bundles appimage
          cp src-tauri/target/release/bundle/appimage/*.AppImage ./radiology-hub-linux-portable.AppImage

      - name: Upload Windows asset
        if: matrix.name == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          files: radiology-hub-windows-portable.zip
          tag_name: ${{ github.ref_name }}

      - name: Upload macOS asset
        if: matrix.name == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          files: radiology-hub-macos-portable.zip
          tag_name: ${{ github.ref_name }}

      - name: Upload Linux asset
        if: matrix.name == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          files: radiology-hub-linux-portable.AppImage
          tag_name: ${{ github.ref_name }}
