name: Release Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build macOS portable
        run: |
          npm run tauri build -- --bundles app
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/radiology-hub.app" "radiology-hub-macos-portable.zip"

      - name: Upload macOS asset
        uses: softprops/action-gh-release@v2
        with:
          files: radiology-hub-macos-portable.zip
          tag_name: ${{ github.ref_name }}

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm install

      - name: Build Linux portable
        run: |
          npm run tauri build -- --bundles appimage
          cp src-tauri/target/release/bundle/appimage/*.AppImage ./radiology-hub-linux-portable.AppImage

      - name: Upload Linux asset
        uses: softprops/action-gh-release@v2
        with:
          files: radiology-hub-linux-portable.AppImage
          tag_name: ${{ github.ref_name }}
